import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
}
repositories {
    mavenCentral()
}
android {
    compileSdk = project.ext.compileSdkVersion
    defaultConfig {
        minSdkVersion project.ext.minSdkVersion
        targetSdkVersion project.ext.targetSdkVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ksp {
            arg('room.schemaLocation', "$projectDir/schemas")
        }

    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
    // ── Release signing resolution ──────────────────────────────────────
    // Resolve credentials once at the android-block scope so both the
    // signingConfigs block and the fail-closed guard below can read them.
    // Password resolution order: SIGN_KEY_PASSWORD env var (CI) →
    // signKeyPassword in local.properties (developer machines, never
    // committed).
    def releaseKeystoreFile = file("../keyStore/release.jks")
    def localProps = new Properties()
    def localPropsFile = rootProject.file("local.properties")
    if (localPropsFile.exists()) {
        localPropsFile.withInputStream { localProps.load(it) }
    }
    def releaseSignPassword = System.getenv("SIGN_KEY_PASSWORD") ?: localProps.getProperty("signKeyPassword")
    // When the release keystore or password is unavailable, the debug
    // keystore fallback is used for DEBUG variants only. Release variants
    // are blocked by the fail-closed guard after the buildTypes block.
    def hasReleaseSigningConfig = releaseKeystoreFile.exists() && releaseSignPassword != null

    signingConfigs {
        if (hasReleaseSigningConfig) {
            pro {
                storeFile releaseKeystoreFile
                storePassword String.valueOf(releaseSignPassword)
                keyAlias "key_pro"
                keyPassword String.valueOf(releaseSignPassword)
            }
        } else {
            // Debug-keystore fallback — DEBUG variants only.
            // Release variants will fail-closed via the task-graph guard.
            def debugKeystore = file("${System.getProperty('user.home')}/.android/debug.keystore")
            pro {
                storeFile debugKeystore
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }
    flavorDimensions = ["tier"]
    productFlavors {
        pro {
            dimension "tier"
            applicationId "vn.unlimit.vpngatepro"
            signingConfig signingConfigs.pro
            // v1.0.38 (§1.6.30): version bump past 2.4.10 — HEAD and tag
            // p2.4.10 had shared the 2.4.10/143 identity for 60+ commits.
            // v2.4.12 (145) — BLOCK v1.0.75: origin labels, two-stage Try Next,
            // history-driven fast connect, Room 10->11, the hero-disconnect fix
            // and the server-list update fixes (device-verified 2026-10-27).
            versionCode 146
            versionName "2.4.13"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        debug {
            versionNameSuffix "-dev"
        }
    }

    // ── Fail-closed guard for release variants ──────────────────────────
    // If the release keystore or password was not available at configuration
    // time, prevent any release assembly/bundle/package task from executing.
    // This avoids silently producing a debug-signed "release" APK.
    // Debug variants are unaffected — they use the debug-keystore fallback.
    if (!hasReleaseSigningConfig) {
        gradle.taskGraph.whenReady { graph ->
            def releaseBuildRequested = graph.allTasks.any { task ->
                task.project == project &&
                task.name.matches(/(assemble|bundle|package).*Release/)
            }
            if (releaseBuildRequested) {
                def missing = []
                if (!releaseKeystoreFile.exists()) {
                    missing.add("release keystore file (keyStore/release.jks)")
                }
                if (releaseSignPassword == null) {
                    missing.add("SIGN_KEY_PASSWORD (env var or signKeyPassword in local.properties)")
                }
                throw new GradleException(
                    "Release build blocked: release signing configuration is incomplete.\n" +
                    "Missing: ${missing.join(', ')}.\n" +
                    "Hint: Set SIGN_KEY_PASSWORD env var or signKeyPassword in local.properties, " +
                    "and ensure the release keystore is present (via blackbox_postdeploy on CI) " +
                    "before building a release variant."
                )
            }
        }
    }
    androidComponents {
        // Keep only the proRelease variant on non-CI machines so the IDE's
        // Build Variants panel shows a single entry.
        if (System.getenv("CI") == null) {
            beforeVariants(selector().withBuildType("debug")) { variant ->
                variant.enabled = false
            }
        }
        onVariants(selector().withBuildType("debug")) { variant ->
            def keystoreFile = rootProject.file("keyStore/release.jks")
            // When the release keystore is not present locally, debug builds
            // fall back to the default debug keystore.
            if (keystoreFile.exists()) {
                def flavorName = variant.productFlavors[0].second
                def androidExt = project.extensions.getByName("android")
                def signingConfig = androidExt.signingConfigs.findByName(flavorName)
                if (signingConfig != null) {
                    variant.signingConfig.setConfig(signingConfig)
                    // Sign the androidTest APK with the same key so it matches the
                    // target's signature (otherwise connectedAndroidTest fails with
                    // "Permission Denial: starting instrumentation ... signature matching")
                    if (variant.androidTest != null) {
                        variant.androidTest.signingConfig.setConfig(signingConfig)
                    }
                }
            }
        }
    }
    useLibrary 'android.test.runner'

    useLibrary 'android.test.base'
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    namespace 'vn.unlimit.vpngate'
    buildFeatures {
        compose true
        buildConfig = true
    }
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_17
    }
}

ext.composeBomVersion = '2026.08.00'
dependencies {
    implementation fileTree(include: ['*.jar', '*.so'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.core:core:1.19.0'
    implementation 'androidx.browser:browser:1.10.0'
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.9.8'
    implementation 'androidx.navigation:navigation-ui-ktx:2.9.8'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation project(path: ':vpnLib')
    implementation project(path: ':sstpClient')
    implementation project(path: ':SoftEtherClient')
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.arch.core:core-testing:2.2.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'
    implementation 'com.squareup.retrofit2:converter-scalars:3.0.0'
    implementation 'org.jsoup:jsoup:1.18.3'
    def room_version = "2.7.1"

    implementation("androidx.room:room-runtime:$room_version")
    annotationProcessor("androidx.room:room-compiler:$room_version")
    ksp "androidx.room:room-compiler:$room_version"

    // Jetpack Compose (2026 redesign)
    implementation platform("androidx.compose:compose-bom:$composeBomVersion")
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.activity:activity-compose:1.11.0'
    implementation 'androidx.navigation:navigation-compose:2.9.8'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.4'
    implementation 'androidx.compose.runtime:runtime-livedata'
    implementation 'io.coil-kt.coil3:coil-compose:3.3.0'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
