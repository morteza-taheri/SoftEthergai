import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'com.android.library'
}

android {
    namespace 'vn.unlimit.softether'
    compileSdk = project.ext.compileSdkVersion

    defaultConfig {
        minSdkVersion project.ext.minSdkVersion
        targetSdkVersion project.ext.targetSdkVersion

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        consumerProguardFiles 'consumer-rules.pro'

        externalNativeBuild {
            cmake {
                cppFlags "-O2 -fPIC -std=c++17"
                cFlags "-O2 -fPIC"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            externalNativeBuild {
                cmake {
                    // DEEP-REVIEW-VERIFY L-01/L-02: the release variant keeps the
                    // CMake default for BUILD_TESTING (OFF), so the native test
                    // library is excluded from the release artifact. Stated
                    // explicitly so a future edit cannot silently re-enable it.
                    arguments "-DBUILD_TESTING=OFF"
                }
            }
        }
        debug {
            debuggable true
            externalNativeBuild {
                cmake {
                    cppFlags "-O0 -g"
                    cFlags "-O0 -g"
                    // DEEP-REVIEW-VERIFY L-01/L-02: the debug variant builds the
                    // native test library. There is no `testBuildType` override in
                    // this project, so androidTest runs against the debug variant
                    // and `src/androidTest` (NativeConnectionTest.kt, which calls
                    // System.loadLibrary("softether_test")) resolves the library
                    // from here.
                    arguments "-DBUILD_TESTING=ON"
                }
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlin {
        compilerOptions {
            jvmTarget = JvmTarget.JVM_17
        }
    }
    buildFeatures {
        buildConfig = true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.18.0'
    implementation 'org.bouncycastle:bcprov-jdk15on:1.70'

    // Kotlin coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'

    // Test dependencies
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
}
