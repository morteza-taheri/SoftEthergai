import org.jetbrains.kotlin.gradle.dsl.JvmTarget

apply plugin: 'com.android.library'
android {
    compileSdk = project.ext.compileSdkVersion

    defaultConfig {
        minSdkVersion project.ext.minSdkVersion
        targetSdkVersion project.ext.targetSdkVersion

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

    }
    buildTypes {
        release {
            // Do NOT minify the library itself. minifyEnabled here caused a
            // *second* R8 pass (library R8 -> app R8): the library pass rewrote
            // VpnStatus.LogListener.newLog(LogItem) -> a with a residual
            // "()V" signature, while AutoModeModuleLogTap was compiled against
            // the original interface. The app-level R8 pass then shipped a
            // mismatched interface/implementation -> AbstractMethodError
            // ("void e24.a()"). Minification stays enabled in app/build.gradle,
            // so the final artifact is still shrunk/obfuscated exactly once.
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    namespace 'de.blinkt.openvpn'
    buildFeatures {
        aidl true
        buildConfig true
    }
}
kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_17
    }
}
dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.security:security-crypto:1.1.0'
}
