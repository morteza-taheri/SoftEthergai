name: Android CI

on:
  push:
    branches-ignore:
      - release
    tags:
      - 'p*'
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
  SIGN_KEY_PASSWORD: ${{ secrets.SIGN_KEY_PASSWORD }}

jobs:
  build-pro:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/hoang-rio/docker-linux-android-sdk:ndk-jdk21

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Apply vpnLib R8 keep-rules patch
        # Upstream vpnLib drops VpnStatus LogListener/LogItem during its own
        # R8 shrink, breaking the app's module log window build. Append the
        # keep rules when the checked-out submodule does not have them yet.
        run: |
          if ! grep -qF 'VpnStatus$LogListener' vpnLib/proguard-rules.pro; then
            printf '%s\n' \
              '-keep class de.blinkt.openvpn.core.VpnStatus$LogListener' \
              '-keep class de.blinkt.openvpn.core.LogItem' \
              '-keepclassmembers class de.blinkt.openvpn.core.LogItem {public *;}' \
              >> vpnLib/proguard-rules.pro
            echo "vpnLib proguard keep rules appended"
          else
            echo "vpnLib already has the keep rules"
          fi

      - name: Ensure debug keystore for unsigned forks
        # Forks do not inherit the blackbox-encrypted release keystore or
        # the GPG key, so the build falls back to the debug keystore — which
        # the CI container does not have. Create one in every plausible
        # user.home (the Gradle daemon resolves /root while the runner HOME
        # is /github/home) so the fork can still produce installable
        # (locally-signed) artifacts.
        if: ${{ ! env.GPG_PRIVATE_KEY }}
        run: |
          gen() {
            mkdir -p "$(dirname "$1")"
            if [ ! -f "$1" ]; then
              keytool -genkeypair -v \
                -keystore "$1" \
                -storepass android -keypass android \
                -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          }
          gen "$HOME/.android/debug.keystore"
          gen "/root/.android/debug.keystore"

      - name: Import GPG key and run blackbox_postdeploy
        run: |
          set -e
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "$GPG_PRIVATE_KEY" | gpg2 --batch --yes --import -
            GPG=gpg2 blackbox_postdeploy || true
          fi

      - name: Java version
        run: java --version

      - name: Install Android SDK platform 37
        # The runner image ships an older SDK; the project pins
        # compileSdk/targetSdk 37 (root build.gradle), so without this step
        # every Gradle task fails with "Failed to find ... android-37".
        #
        # The platform ships under a minor-versioned directory (android-37.0)
        # and its sdkmanager package id has moved between releases, so resolve
        # the id from the repository itself instead of hardcoding it, then
        # verify the directory exists. A silent no-op here surfaces much later
        # as an opaque "Failed to find target with hash string 'android-37'".
        run: |
          set -e
          SDK=/opt/android-sdk-linux
          yes | sdkmanager --sdk_root=$SDK --licenses > /dev/null 2>&1 || true

          echo "platforms before: $(ls $SDK/platforms 2>/dev/null | tr '\n' ' ')"
          sdkmanager --sdk_root=$SDK --list \
            | grep -E '^\s*platforms;android-37' \
            | awk '{print $1}' \
            | sort -u > /tmp/pkgs.txt || true
          echo "candidate platform packages:"
          cat /tmp/pkgs.txt

          if [ -s /tmp/pkgs.txt ]; then
            sdkmanager --sdk_root=$SDK $(cat /tmp/pkgs.txt | tr '\n' ' ')
          fi
          sdkmanager --sdk_root=$SDK "build-tools;37.0.0" || true

          echo "platforms after: $(ls $SDK/platforms 2>/dev/null | tr '\n' ' ')"

          # The container installs the minor-versioned directory (android-37.x)
          # but Gradle resolves the platform by the plain hash string
          # 'android-37'. Without this alias every later task fails with
          # "Failed to find target with hash string 'android-37'".
          if ! ls $SDK/platforms | grep -qx 'android-37'; then
            src=$(ls -d $SDK/platforms/android-37* 2>/dev/null | grep -v beta | head -n 1 || true)
            if [ -n "$src" ]; then
              echo "aliasing $src -> $SDK/platforms/android-37"
              ln -sfn "$src" "$SDK/platforms/android-37"
            fi
          fi

          if ! ls $SDK/platforms | grep -qx 'android-37'; then
            echo "::error::android-37 platform is still missing after install"
            ls -la $SDK/platforms
            exit 1
          fi
          echo "android-37 platform present: $(ls -d $SDK/platforms/android-37)"

      - name: Diagnose android-37 resolution
        # Read-only diagnosis of "Failed to find target with hash string
        # 'android-37'". Reports only: it never installs, symlinks or mutates
        # the SDK, and it must never fail the build.
        continue-on-error: true
        run: |
          set +e
          SDK=/opt/android-sdk-linux
          echo "===== 1. environment ====="
          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<unset>}"
          echo "ANDROID_SDK_HOME=${ANDROID_SDK_HOME:-<unset>}"
          echo "HOME=$HOME"
          echo "JAVA_HOME=${JAVA_HOME:-<unset>}"

          echo "===== 2. candidate SDK roots ====="
          for d in /opt/android-sdk-linux /opt/android-sdk /usr/local/lib/android/sdk /root/Android/Sdk /github/home/Android/Sdk "$HOME/Android/Sdk"; do
            if [ -d "$d" ]; then
              echo "EXISTS  $d"
              echo "        platforms: $(ls $d/platforms 2>/dev/null | tr '\n' ' ')"
            else
              echo "ABSENT  $d"
            fi
          done

          echo "===== 3. SDK hints in local.properties / gradle.properties ====="
          echo "--- local.properties ---"
          cat local.properties 2>/dev/null || echo "(none)"
          echo "--- gradle.properties sdk lines ---"
          grep -i 'sdk' gradle.properties 2>/dev/null || echo "(none)"

          echo "===== 4. platforms directory, full listing ====="
          ls -la "$SDK/platforms" 2>&1
          echo
          echo "--- every android-37* entry: type, target, file count ---"
          for p in "$SDK"/platforms/android-37*; do
            [ -e "$p" ] || continue
            if [ -L "$p" ]; then
              echo "SYMLINK   $p -> $(readlink "$p")  (resolved: $(readlink -f "$p"))"
            else
              echo "DIRECTORY $p"
            fi
            echo "          file count: $(find "$p" -type f 2>/dev/null | wc -l)"
          done

          echo "===== 5. required files per candidate ====="
          for p in "$SDK"/platforms/android-37*; do
            [ -e "$p" ] || continue
            echo "--- $p ---"
            for f in android.jar source.properties package.xml build.prop core-for-system-modules.jar; do
              if [ -f "$p/$f" ]; then
                echo "  PRESENT $f  ($(stat -c%s "$p/$f") bytes)"
              else
                echo "  MISSING $f"
              fi
            done
            echo "  top-level entries:"
            ls -1 "$p" 2>&1 | sed 's/^/    /'
          done

          echo "===== 6. source.properties contents ====="
          for p in "$SDK"/platforms/android-37*; do
            [ -f "$p/source.properties" ] || continue
            echo "--- $p/source.properties ---"
            cat "$p/source.properties"
          done

          echo "===== 7. compileSdk / targetSdk as Gradle sees them ====="
          ./gradlew --no-daemon -q :app:properties --offline 2>&1 \
            | grep -iE 'compileSdk|targetSdk|buildToolsVersion|minSdk' \
            | sed 's/^/  /'

          echo "===== 8. Gradle platform resolution attempt ====="
          ./gradlew --no-daemon --offline :app:assembleProRelease --dry-run 2>&1 \
            | grep -iE 'android-3[5-9]|Failed to find|hash string|platforms/' \
            | sed 's/^/  /'

          echo "===== 9. interpretation ====="
          echo "MISSING android.jar in every android-37* dir => platform never"
          echo "  unpacked; the install step silently did nothing."
          echo "android.jar present but Gradle still fails => Gradle is reading"
          echo "  a different SDK root, or rejects the directory name/hash."

      - name: Build OpenSSL headers
        run: |
          cd SoftEtherClient/src/main/cpp && ./build-openssl-android.sh --headers-only

      - name: Unit tests
        run: ./gradlew :app:testProDebugUnitTest

      - name: Assemble Pro Release APK
        run: ./gradlew assembleProRelease

      - name: Bundle Pro Release AAB
        if: startsWith(github.ref, 'refs/tags/')
        run: ./gradlew :app:bundleProRelease

      - name: Upload Pro APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: apk-pro
          path: app/build/outputs/apk/pro/release/app-pro-release.apk

      - name: Upload Pro AAB
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: aab-pro
          path: app/build/outputs/bundle/proRelease/app-pro-release.aab
