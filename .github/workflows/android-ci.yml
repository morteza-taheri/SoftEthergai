name: Android CI

on:
  push:
    branches-ignore:
      - release
    tags:
      - 'p*'
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
  SIGN_KEY_PASSWORD: ${{ secrets.SIGN_KEY_PASSWORD }}

jobs:
  build-pro:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/hoang-rio/docker-linux-android-sdk:ndk-jdk21

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Apply vpnLib R8 keep-rules patch
        # Upstream vpnLib drops VpnStatus LogListener/LogItem during its own
        # R8 shrink, breaking the app's module log window build. Append the
        # keep rules when the checked-out submodule does not have them yet.
        run: |
          if ! grep -qF 'VpnStatus$LogListener' vpnLib/proguard-rules.pro; then
            printf '%s\n' \
              '-keep class de.blinkt.openvpn.core.VpnStatus$LogListener' \
              '-keep class de.blinkt.openvpn.core.LogItem' \
              '-keepclassmembers class de.blinkt.openvpn.core.LogItem {public *;}' \
              >> vpnLib/proguard-rules.pro
            echo "vpnLib proguard keep rules appended"
          else
            echo "vpnLib already has the keep rules"
          fi

      - name: Ensure debug keystore for unsigned forks
        # Forks do not inherit the blackbox-encrypted release keystore or
        # the GPG key, so the build falls back to the debug keystore — which
        # the CI container does not have. Create one in every plausible
        # user.home (the Gradle daemon resolves /root while the runner HOME
        # is /github/home) so the fork can still produce installable
        # (locally-signed) artifacts.
        if: ${{ ! env.GPG_PRIVATE_KEY }}
        run: |
          gen() {
            mkdir -p "$(dirname "$1")"
            if [ ! -f "$1" ]; then
              keytool -genkeypair -v \
                -keystore "$1" \
                -storepass android -keypass android \
                -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          }
          gen "$HOME/.android/debug.keystore"
          gen "/root/.android/debug.keystore"

      - name: Import GPG key and run blackbox_postdeploy
        run: |
          set -e
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "$GPG_PRIVATE_KEY" | gpg2 --batch --yes --import -
            GPG=gpg2 blackbox_postdeploy || true
          fi

      - name: Java version
        run: java --version

      - name: Build OpenSSL headers
        run: |
          cd SoftEtherClient/src/main/cpp && ./build-openssl-android.sh --headers-only

      - name: Unit tests
        run: ./gradlew :app:testProDebugUnitTest

      - name: Assemble Pro Release APK
        run: ./gradlew assembleProRelease

      - name: Bundle Pro Release AAB
        if: startsWith(github.ref, 'refs/tags/')
        run: ./gradlew :app:bundleProRelease

      - name: Upload Pro APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: apk-pro
          path: app/build/outputs/apk/pro/release/app-pro-release.apk

      - name: Upload Pro AAB
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: aab-pro
          path: app/build/outputs/bundle/proRelease/app-pro-release.aab
